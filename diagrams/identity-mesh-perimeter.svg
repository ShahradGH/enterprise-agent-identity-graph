    <text x="25" y="165" fill="#CBD5E1" font-size="11">tid: 79b3c106-7fe3...</text>
    <text x="25" y="190" fill="#CBD5E1" font-size="11">roles: SupplyChain.Planner</text>
    <text x="25" y="212" fill="#10B981" font-size="10">OBO Flow Enabled</text>

    <rect x="15" y="245" width="210" height="165" rx="6" fill="#0A0F1D" stroke="#334155"/>
