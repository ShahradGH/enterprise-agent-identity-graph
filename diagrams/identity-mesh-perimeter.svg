    <text x="25" y="295" fill="#FCA5A5" font-size="11">✖ SharePoint Legal Contracts</text>
    <text x="25" y="320" fill="#FCA5A5" font-size="11">✖ Direct SQL Query Drop</text>
    <text x="25" y="345" fill="#FCA5A5" font-size="11">✖ ERP / SAP Batch Writes</text>
    <text x="25" y="375" fill="#EF4444" font-size="11">BLOCKED: SQL Fallback</text>
