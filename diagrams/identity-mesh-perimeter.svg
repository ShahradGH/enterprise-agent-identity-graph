    <text x="25" y="320" fill="#FCA5A5" font-size="11">✖ Unvetted Batch Reschedule</text>
    <text x="25" y="345" fill="#FCA5A5" font-size="11">Requires: VP Dual Signature</text>
    <text x="25" y="375" fill="#EF4444" font-size="11">BLOCKED: Autonomic Mutation</text>
