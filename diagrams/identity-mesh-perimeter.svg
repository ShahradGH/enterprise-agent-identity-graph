  <!-- Bottom Footer -->
  <rect x="30" y="560" width="1140" height="95" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
  <text x="50" y="590" fill="#38BDF8" font-size="14" font-weight="700">MICROSOFT GRAPH GOVERNANCE INVARIANT:</text>
  <text x="50" y="615" fill="#94A3B8" font-size="12">• Every agent must possess an assigned Entra Service Principal and accountable human owner · Unregistered agents are terminated</text>
  <text x="50" y="638" fill="#94A3B8" font-size="12">• Automated 4-Step Joiner/Mover/Leaver runbook invalidates SPN tokens, revokes Key Vault access, and archives memory threads</text>
