    <text x="25" y="295" fill="#94A3B8" font-size="11">• No anonymous calls</text>
    <text x="25" y="320" fill="#94A3B8" font-size="11">• No shared API keys</text>
    <text x="25" y="345" fill="#94A3B8" font-size="11">• Conditional Access VNet lock</text>
    <text x="25" y="375" fill="#10B981" font-size="11">✓ Zero Token Leakage</text>
