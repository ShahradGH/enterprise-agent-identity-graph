  <!-- Connective Arrows & Protocol Badges -->
  <path d="M 290 220 L 325 220" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 575 220 L 610 220" stroke="#FBBF24" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 860 220 L 895 220" stroke="#A855F7" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Footer Banner -->
  <rect x="30" y="560" width="1140" height="95" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
