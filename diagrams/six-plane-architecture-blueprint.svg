    <!-- Flow A -->
    <rect x="30" y="60" width="550" height="195" rx="10" fill="#131B33" stroke="#F59E0B"/>
    <text x="50" y="90" fill="#F59E0B" font-size="16" font-weight="700">⚡ Flow A: Business Decision Flow</text>
    <text x="50" y="120" fill="#E2E8F0" font-size="13">1. Shortfall event (25k units) triggers SLA Ingest Agent</text>
    <text x="50" y="145" fill="#E2E8F0" font-size="13">2. Agent 1 extracts penalty terms ➔ queries Capacity Agent</text>
    <text x="50" y="170" fill="#E2E8F0" font-size="13">3. Agent 2 verifies line PKG-02 clean window in Fabric IQ</text>
    <text x="50" y="195" fill="#E2E8F0" font-size="13">4. Agent 3 posts Teams Dual-Sign Card ➔ Human Approval ➔ SAP</text>

    <!-- Flow B -->
    <rect x="625" y="60" width="550" height="195" rx="10" fill="#131B33" stroke="#38BDF8"/>
    <text x="645" y="90" fill="#38BDF8" font-size="16" font-weight="700">🔐 Flow B: Identity &amp; Token Mesh Flow</text>
    <text x="645" y="120" fill="#E2E8F0" font-size="13">1. Entra ID Graph provisions 3 distinct App Registrations</text>
    <text x="645" y="145" fill="#E2E8F0" font-size="13">2. Workload Identity federation injects ephemeral tokens</text>
    <text x="645" y="170" fill="#E2E8F0" font-size="13">3. Delegated OBO propagation enforces POSIX ACL trimming</text>
    <text x="645" y="195" fill="#E2E8F0" font-size="13">4. Agent 365 monitors zero zombie agents &amp; offboarding lifecycle</text>

    <!-- Flow C -->
    <rect x="1220" y="60" width="550" height="195" rx="10" fill="#131B33" stroke="#A855F7"/>
    <text x="1240" y="90" fill="#A855F7" font-size="16" font-weight="700">🛡️ Flow C: IT Telemetry &amp; Circuit Breaker Flow</text>
    <text x="1240" y="120" fill="#E2E8F0" font-size="13">1. W3C traceparent headers injected across all agent handoffs</text>
    <text x="1240" y="145" fill="#E2E8F0" font-size="13">2. Application Insights correlates end-to-end turn latencies</text>
    <text x="1240" y="170" fill="#E2E8F0" font-size="13">3. Hard 12-turn circuit breaker kills rogue negotiation loops</text>
    <text x="1240" y="195" fill="#E2E8F0" font-size="13">4. Defender for Cloud runtime shield intercepts prompt injections</text>
