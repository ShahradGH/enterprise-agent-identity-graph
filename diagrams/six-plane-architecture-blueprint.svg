    <text x="565" y="125" fill="#94A3B8" font-size="13">• Master Production Scheduling (MPS) batch reschedule</text>
    <text x="565" y="150" fill="#94A3B8" font-size="13">• Production batch 8812 reallocated: 20,000 units to PKG-02</text>
    <text x="565" y="175" fill="#94A3B8" font-size="13">• €12M commercial contract forfeiture strictly prevented</text>
    <rect x="565" y="195" width="560" height="28" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="585" y="214" fill="#10B981" font-size="12" font-weight="600">Status: BATCH COMMITTED ONLY AFTER DUAL SIGNATURE</text>
  </g>

  <!-- Plane 6: Dynamic Connective Flows -->
