    <text x="50" y="152" fill="#94A3B8" font-size="13">Sign-off 1: VP Supply-Chain (Commercial Approval)</text>
    <text x="50" y="176" fill="#94A3B8" font-size="13">Sign-off 2: Plant Operations Lead (Autoclave Safety Check)</text>
    <text x="50" y="205" fill="#EF4444" font-size="12" font-weight="600">Rule: Agents CANNOT write to ERP without cryptographic approval tokens.</text>

    <!-- SAP S/4HANA Box -->
