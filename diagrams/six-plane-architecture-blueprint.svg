    <text x="32" y="85" fill="#38BDF8" font-size="13" font-weight="700">1. SLA Ingest</text>
    <text x="32" y="110" fill="#94A3B8" font-size="11">sp-agent-sla-reader</text>
    <text x="32" y="135" fill="#CBD5E1" font-size="11">Files.Read.All</text>
