    <text x="24" y="155" fill="#94A3B8" font-size="13">• Real-Time Push: Sub-second shortfall notifications</text>
    <rect x="24" y="190" width="522" height="45" rx="8" fill="#0A0F1D" stroke="#1E293B"/>
    <text x="40" y="218" fill="#38BDF8" font-size="13" font-family="monospace">Claim: scp="Decision.Initiate" | tid="79b3c106..."</text>
  </g>

  <!-- Plane 2: Runtime Fleet -->
  <g transform="translate(675, 140)" filter="url(#boxShadow)">
    <rect width="570" height="260" rx="14" fill="url(#planeGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="42" rx="14" fill="#818CF8" fill-opacity="0.15"/>
    <text x="24" y="28" fill="#818CF8" font-size="16" font-weight="700">PLANE 2 · GOVERNED AGENT FLEET (FOUNDRY &amp; 365)</text>
    
