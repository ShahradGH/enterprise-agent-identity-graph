    <rect x="0" y="0" width="570" height="42" rx="14" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="24" y="28" fill="#38BDF8" font-size="16" font-weight="700">PLANE 1 · EXPERIENCE &amp; AUTHORISATION</text>
    <text x="24" y="75" fill="#E2E8F0" font-size="18" font-weight="600">Teams Copilot Cowork &amp; Web Studio</text>
    <text x="24" y="105" fill="#94A3B8" font-size="13">• Planner Identity: Entra ID OAuth 2.0 Bearer JWT (OBO Flow)</text>
