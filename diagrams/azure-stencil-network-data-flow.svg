<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" style="background:#080D1A; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="netShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Banner -->
  <rect x="30" y="20" width="1340" height="70" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="62" fill="#FFFFFF" font-size="22" font-weight="700">AZURE NETWORK TRAFFIC &amp; PRIVATE ENDPOINT DATA FLOW</text>
  <rect x="1080" y="38" width="260" height="34" rx="17" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="1105" y="60" fill="#38BDF8" font-size="12" font-weight="600">TLS 1.3 · RFC 1918 Private Mesh</text>

  <!-- VNet Hub & Spoke Container -->
  <rect x="30" y="110" width="1340" height="630" rx="12" fill="#0A1124" stroke="#0284C7" stroke-width="2"/>
  <rect x="30" y="110" width="1340" height="38" rx="12" fill="#0284C7" fill-opacity="0.25"/>
  <text x="60" y="135" fill="#38BDF8" font-size="14" font-weight="700">VNET TOPOLOGY: vnet-enterprise-ai (10.100.0.0/16) · Hub-and-Spoke Enclave Routing</text>

  <!-- Subnet 1: Ingress / Gateway Subnet -->
  <g transform="translate(60, 170)" filter="url(#netShadow)">
    <rect width="380" height="540" rx="8" fill="#0E172E" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="380" height="32" rx="8" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="15" y="22" fill="#38BDF8" font-size="13" font-weight="700">SUBNET: snet-ai-ingress (10.100.1.0/24)</text>

    <!-- Ingress Appliance -->
    <rect x="20" y="50" width="340" height="130" rx="6" fill="#141E38" stroke="#38BDF8"/>
    <circle cx="50" cy="80" r="18" fill="#0078D4" fill-opacity="0.2"/>
    <text x="80" y="78" fill="#FFFFFF" font-size="14" font-weight="700">Azure Application Gateway v2 / APIM</text>
    <text x="80" y="98" fill="#94A3B8" font-size="11">IP: 10.100.1.4 · TLS 1.3 Termination</text>
    <text x="35" y="130" fill="#E2E8F0" font-size="11">• WAF Policy: Bot Manager &amp; Injection Guard</text>
    <text x="35" y="152" fill="#E2E8F0" font-size="11">• Ingress: HTTPS/443 with Entra Bearer JWT</text>
    <text x="35" y="172" fill="#10B981" font-size="10">✓ Packet Path 1: User / Cowork Ingress</text>

    <!-- Agent 1 Runtime Subnet Box -->
    <rect x="20" y="200" width="340" height="150" rx="6" fill="#141E38" stroke="#334155"/>
    <circle cx="50" cy="230" r="18" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="80" y="228" fill="#38BDF8" font-size="14" font-weight="700">Agent 1: SLA Ingest Container</text>
    <text x="80" y="248" fill="#94A3B8" font-size="11">IP: 10.100.1.15 · Subnet Ingress Delegated</text>
    <text x="35" y="280" fill="#94A3B8" font-size="11">• Private DNS: privatelink.search.windows.net</text>
    <text x="35" y="302" fill="#94A3B8" font-size="11">• NSG Rule: Allow-Outbound-To-Foundry-IQ</text>
    <text x="35" y="324" fill="#EF4444" font-size="10">✖ Deny-Outbound-Internet-All (0.0.0.0/0)</text>

    <!-- Network Security Group Rules -->
    <rect x="20" y="370" width="340" height="140" rx="6" fill="#090E1A" stroke="#334155"/>
    <text x="35" y="398" fill="#F1F5F9" font-size="13" font-weight="600">NSG: nsg-ai-ingress-rules</text>
    <text x="35" y="425" fill="#94A3B8" font-size="11">Priority 100: Allow-Entra-OAuth-Inbound (TCP/443)</text>
    <text x="35" y="448" fill="#94A3B8" font-size="11">Priority 200: Allow-Inter-Agent-Transit (10.100.2.0/24)</text>
    <text x="35" y="472" fill="#EF4444" font-size="11">Priority 4096: Deny-All-Inbound-Default</text>
    <text x="35" y="495" fill="#10B981" font-size="10">✓ Packet walk strictly isolated</text>
  </g>

  <!-- Subnet 2: Analytical Transit Subnet -->
  <g transform="translate(470, 170)" filter="url(#netShadow)">
    <rect width="400" height="540" rx="8" fill="#0E172E" stroke="#FBBF24" stroke-width="1.5"/>
    <rect width="400" height="32" rx="8" fill="#FBBF24" fill-opacity="0.15"/>
    <text x="15" y="22" fill="#FBBF24" font-size="13" font-weight="700">SUBNET: snet-analytical-spoke (10.100.2.0/24)</text>

    <!-- Private Endpoint 1 -->
    <rect x="20" y="50" width="360" height="120" rx="6" fill="#141E38" stroke="#10B981"/>
    <circle cx="50" cy="80" r="18" fill="#10B981" fill-opacity="0.2"/>
    <text x="80" y="78" fill="#10B981" font-size="14" font-weight="700">Private Endpoint: Azure AI Search</text>
    <text x="80" y="98" fill="#94A3B8" font-size="11">NIC IP: 10.100.2.10 · Microsecond DNS Link</text>
    <text x="35" y="130" fill="#E2E8F0" font-size="11">• Traffic Path: Agent 1 ➔ Search via Private Link</text>
    <text x="35" y="152" fill="#10B981" font-size="10">✓ Zero egress across public IP boundaries</text>

    <!-- Private Endpoint 2 -->
    <rect x="20" y="190" width="360" height="130" rx="6" fill="#141E38" stroke="#FBBF24"/>
    <circle cx="50" cy="220" r="18" fill="#FBBF24" fill-opacity="0.2"/>
    <text x="80" y="218" fill="#FBBF24" font-size="14" font-weight="700">Private Link: Microsoft Fabric</text>
    <text x="80" y="238" fill="#94A3B8" font-size="11">Managed Private VNet Interconnect</text>
    <text x="35" y="270" fill="#E2E8F0" font-size="11">• Direct Lake in-memory VertiPaq payload (&lt;120ms)</text>
    <text x="35" y="292" fill="#E2E8F0" font-size="11">• Traffic Path: Agent 2 ➔ Fabric Lakehouse</text>
    <text x="35" y="312" fill="#10B981" font-size="10">✓ Governed semantic measures only</text>

    <!-- Agent 2 Runtime Box -->
    <rect x="20" y="340" width="360" height="170" rx="6" fill="#141E38" stroke="#334155"/>
    <circle cx="50" cy="370" r="18" fill="#0078D4" fill-opacity="0.2"/>
    <text x="80" y="368" fill="#FFFFFF" font-size="13" font-weight="600">Agent 2 Container Runtime</text>
    <text x="80" y="388" fill="#94A3B8" font-size="11">IP: 10.100.2.25 · Subnet Isolated</text>
    <text x="35" y="420" fill="#94A3B8" font-size="11">• Receives evaluated SLA payload from Agent 1</text>
    <text x="35" y="442" fill="#94A3B8" font-size="11">• Forwards verified capacity proposal to Agent 3</text>
    <text x="35" y="465" fill="#94A3B8" font-size="11">• Injecting W3C traceparent headers on transit</text>
    <text x="35" y="490" fill="#10B981" font-size="10">✓ Packet Latency: &lt;18ms internal hop</text>
  </g>

  <!-- Subnet 3: Data Persistence & ERP Boundary Subnet -->
  <g transform="translate(900, 170)" filter="url(#netShadow)">
    <rect width="440" height="540" rx="8" fill="#0E172E" stroke="#A855F7" stroke-width="1.5"/>
    <rect width="440" height="32" rx="8" fill="#A855F7" fill-opacity="0.15"/>
    <text x="15" y="22" fill="#A855F7" font-size="13" font-weight="700">SUBNET: snet-decision-core (10.100.3.0/24)</text>

    <!-- Cosmos DB Private Endpoint -->
    <rect x="20" y="50" width="400" height="140" rx="6" fill="#141E38" stroke="#A855F7"/>
    <circle cx="50" cy="80" r="18" fill="#A855F7" fill-opacity="0.2"/>
    <text x="80" y="78" fill="#A855F7" font-size="14" font-weight="700">Private Endpoint: Azure Cosmos DB</text>
    <text x="80" y="98" fill="#94A3B8" font-size="11">NIC IP: 10.100.3.12 · Decision Memory</text>
    <text x="35" y="130" fill="#E2E8F0" font-size="11">• Traffic Path: Agent 3 ➔ Cosmos DB (Port 443)</text>
    <text x="35" y="152" fill="#E2E8F0" font-size="11">• Hierarchical partition: [/user_id, /thread_id]</text>
    <text x="35" y="174" fill="#10B981" font-size="10">✓ Sub-10ms point write latency verified</text>

    <!-- ERP Firewall Boundary -->
    <rect x="20" y="210" width="400" height="160" rx="6" fill="#1C1014" stroke="#EF4444" stroke-width="2"/>
    <text x="35" y="238" fill="#EF4444" font-size="14" font-weight="700">🛑 FIREWALL REFUSAL GATE: SAP S/4HANA</text>
    <text x="35" y="262" fill="#FCA5A5" font-size="11">Virtual Network Peering with State Inspection</text>
    <text x="35" y="286" fill="#94A3B8" font-size="11">• Rule: All autonomous agent traffic BLOCKED at Layer 7</text>
    <text x="35" y="308" fill="#94A3B8" font-size="11">• Exception: Requires Cryptographic Human Approval Token</text>
    <text x="35" y="330" fill="#94A3B8" font-size="11">• Dual-Signature validation executed in Teams Cowork</text>
    <text x="35" y="352" fill="#EF4444" font-size="10">🛑 ZERO DIRECT ERP WRITES PERMITTED BY AGENTS</text>

    <!-- Diagnostics / Log Analytics Forwarder -->
    <rect x="20" y="390" width="400" height="120" rx="6" fill="#090E1A" stroke="#334155"/>
    <circle cx="50" cy="420" r="18" fill="#0078D4" fill-opacity="0.2"/>
    <text x="80" y="418" fill="#F1F5F9" font-size="13" font-weight="600">Azure Monitor &amp; App Insights Sink</text>
    <text x="80" y="438" fill="#94A3B8" font-size="11">Private Link Scope (AMPLS): 10.100.3.50</text>
    <text x="35" y="470" fill="#94A3B8" font-size="11">• Continuous ingestion of W3C telemetry &amp; loop metrics</text>
    <text x="35" y="490" fill="#10B981" font-size="10">✓ Alerting trigger on &gt;12 recursive loops</text>
  </g>

  <!-- Manhattan Traffic Flow Arrows -->
  <path d="M 400 300 L 470 300" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="408" y="290" fill="#38BDF8" font-size="10" font-weight="600">TCP/443</text>

  <path d="M 870 300 L 900 300" stroke="#FBBF24" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="874" y="290" fill="#FBBF24" font-size="10" font-weight="600">mTLS</text>

  <!-- Footer Banner -->
  <rect x="30" y="760" width="1340" height="70" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
  <text x="50" y="790" fill="#38BDF8" font-size="13" font-weight="700">NETWORK SECURITY ASSURANCE:</text>
  <text x="50" y="812" fill="#94A3B8" font-size="11">• Private Endpoints enforce microsegmentation across all 3 agent tiers · Split-brain DNS eliminated via Azure Private DNS Zones</text>
  <text x="50" y="828" fill="#94A3B8" font-size="11">• All cross-subnet transit audited by Network Watcher Flow Logs &amp; Defender for Cloud Threat Intelligence</text>
</svg>
