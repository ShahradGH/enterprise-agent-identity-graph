    <text x="35" y="130" fill="#E2E8F0" font-size="11">• Commits proposal to Cosmos DB: APPROVED_PENDING_ERP</text>
    <text x="35" y="152" fill="#E2E8F0" font-size="11">• Dispatches approval card to Teams Copilot Cowork</text>
    <text x="35" y="174" fill="#EF4444" font-size="11">🛑 DIRECT WRITE TO ERP IS STRUCTURALLY BLOCKED</text>

    <!-- Azure Cosmos DB Box -->
    <rect x="20" y="220" width="400" height="140" rx="6" fill="#10182C" stroke="#0078D4"/>
    <circle cx="50" cy="250" r="18" fill="#0078D4" fill-opacity="0.2"/>
    <text x="80" y="248" fill="#FFFFFF" font-size="14" font-weight="700">Azure Cosmos DB (Decision Memory)</text>
    <text x="80" y="268" fill="#94A3B8" font-size="11">Hierarchical Partition: [/user_id, /thread_id]</text>
    <text x="35" y="300" fill="#94A3B8" font-size="11">• Stores case_records, multi-turn history &amp; 'Why' rationale</text>
    <text x="35" y="322" fill="#94A3B8" font-size="11">• Sub-10ms point read latency across sessions</text>
    <text x="35" y="342" fill="#10B981" font-size="10">✓ 7-year regulatory preservation lock enabled</text>

    <!-- Human Sovereign Veto Gate -->
    <rect x="20" y="380" width="400" height="135" rx="6" fill="#1C1014" stroke="#EF4444" stroke-width="2"/>
    <text x="35" y="408" fill="#EF4444" font-size="14" font-weight="700">🛑 HUMAN ARCHITECTURAL DUAL-SIGNATURE</text>
    <text x="35" y="432" fill="#FCA5A5" font-size="11">Sign-off 1: VP Supply-Chain (Commercial Clearance)</text>
    <text x="35" y="452" fill="#FCA5A5" font-size="11">Sign-off 2: Plant Lead (Autoclave Maintenance Check)</text>
    <rect x="35" y="468" width="370" height="32" rx="4" fill="#0A0F1D" stroke="#EF4444"/>
    <text x="45" y="489" fill="#10B981" font-size="11" font-weight="600">✓ SAP S/4HANA Mutated ONLY After Dual Cryptographic Sign-Off</text>
