    <text x="80" y="448" fill="#94A3B8" font-size="11">POSIX ACL Query-Time Security Trimming</text>
    <text x="35" y="480" fill="#94A3B8" font-size="11">• Ingests co-packer SLA tables with table layout</text>
    <text x="35" y="498" fill="#10B981" font-size="10">✓ Private Endpoint: 10.100.2.10</text>
  </g>

  <!-- Container 3: Decision Memory & Veto Gate (Spoke Core) -->
  <g transform="translate(900, 170)" filter="url(#cardShadow)">
    <rect width="440" height="540" rx="8" fill="#090E1D" stroke="#A855F7" stroke-width="1.5"/>
