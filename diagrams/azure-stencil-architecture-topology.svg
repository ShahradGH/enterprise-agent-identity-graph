    <text x="35" y="450" fill="#94A3B8" font-size="11">• Ephemeral OIDC token signing</text>
    <text x="35" y="472" fill="#94A3B8" font-size="11">• Zero long-lived client secrets stored</text>
    <text x="35" y="494" fill="#10B981" font-size="10">✓ Private Endpoint: 10.100.1.4</text>
  </g>

  <!-- Container 2: Analytical Grounding (Spoke AI) -->
  <g transform="translate(470, 170)" filter="url(#cardShadow)">
    <rect width="400" height="540" rx="8" fill="#090E1D" stroke="#FBBF24" stroke-width="1.5"/>
    <rect width="400" height="32" rx="8" fill="#FBBF24" fill-opacity="0.15"/>
