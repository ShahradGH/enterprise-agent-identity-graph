    <circle cx="50" cy="230" r="18" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="80" y="228" fill="#38BDF8" font-size="14" font-weight="700">Agent 1: Ingestion &amp; SLA Parser</text>
    <text x="80" y="248" fill="#94A3B8" font-size="11">Azure AI Foundry Hosted Container</text>
    <text x="35" y="280" fill="#E2E8F0" font-size="11">• Scopes: Files.Read.All (Delegated)</text>
    <text x="35" y="302" fill="#E2E8F0" font-size="11">• Ingests vendor co-packer SLAs from SharePoint</text>
    <text x="35" y="324" fill="#10B981" font-size="11">✓ Zero database write permissions</text>

