  <!-- Connective Lines -->
  <path d="M 440 260 L 470 260" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5,5"/>
  <path d="M 870 260 L 900 260" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="5,5"/>

  <!-- Footer Banner -->
  <rect x="30" y="760" width="1340" height="70" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
  <text x="50" y="790" fill="#38BDF8" font-size="13" font-weight="700">ENTERPRISE CLOUD GOVERNANCE CONTROLS:</text>
  <text x="50" y="812" fill="#94A3B8" font-size="11">• All communication constrained within Private Endpoints &amp; Virtual Network Service Tags · Zero public internet ingress</text>
  <text x="50" y="828" fill="#94A3B8" font-size="11">• Defender for Cloud inline runtime inspection &amp; Microsoft Agent 365 lifecycle inventory active</text>
</svg>
