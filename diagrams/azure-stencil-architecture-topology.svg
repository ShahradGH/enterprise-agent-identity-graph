    <text x="35" y="130" fill="#E2E8F0" font-size="11">• Scopes: Dataset.Read.All (Fabric IQ)</text>
    <text x="35" y="152" fill="#E2E8F0" font-size="11">• Queries measure: [Realized_Capacity]</text>
    <text x="35" y="174" fill="#10B981" font-size="11">✓ In-Memory Direct Lake VertiPaq (&lt;120ms)</text>
    <text x="35" y="194" fill="#EF4444" font-size="10">✖ DirectQuery SQL fallback blocked</text>

