    <circle cx="50" cy="260" r="18" fill="#0078D4" fill-opacity="0.2"/>
    <text x="80" y="258" fill="#FFFFFF" font-size="14" font-weight="700">Microsoft Fabric OneLake</text>
    <text x="80" y="278" fill="#94A3B8" font-size="11">TMDL Governed Business Semantic Model</text>
    <text x="35" y="310" fill="#94A3B8" font-size="11">• PackagingLine Delta Tables (Delta Parquet)</text>
    <text x="35" y="332" fill="#94A3B8" font-size="11">• Machine OEE telemetry streaming via KQL</text>
    <text x="35" y="354" fill="#10B981" font-size="10">✓ Governed semantic metrics · Zero column confusion</text>

    <!-- AI Search & POSIX Trimming -->
    <rect x="20" y="400" width="360" height="110" rx="6" fill="#10182C" stroke="#334155"/>
    <circle cx="50" cy="430" r="18" fill="#38BDF8" fill-opacity="0.2"/>
