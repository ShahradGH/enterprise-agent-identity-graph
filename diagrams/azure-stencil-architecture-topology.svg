<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" style="background:#080D1A; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#50E6FF"/>
    </linearGradient>
    <linearGradient id="vnetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111E38" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Banner -->
  <rect x="30" y="20" width="1340" height="70" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="62" fill="#FFFFFF" font-size="22" font-weight="700">AZURE ARCHITECTURE TOPOLOGY: 3-AGENT ENTERPRISE FLEET</text>
  <rect x="1100" y="38" width="240" height="34" rx="17" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
  <text x="1125" y="60" fill="#10B981" font-size="12" font-weight="600">✓ Avanade Architecture Standard</text>

  <!-- Perimeter: Azure Landing Zone Subscription -->
  <rect x="30" y="110" width="1340" height="630" rx="12" fill="url(#vnetGrad)" stroke="#0078D4" stroke-width="2"/>
  <rect x="30" y="110" width="1340" height="38" rx="12" fill="#0078D4" fill-opacity="0.25"/>
  <text x="60" y="135" fill="#50E6FF" font-size="14" font-weight="700">SUBSCRIPTION: sub-enterprise-ai-platform-prod (UK South) · Landing Zone Governance</text>

  <!-- Container 1: Hub Network & Identity (VNet Hub) -->
  <g transform="translate(60, 170)" filter="url(#cardShadow)">
    <rect width="380" height="540" rx="8" fill="#090E1D" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="380" height="32" rx="8" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="15" y="22" fill="#38BDF8" font-size="13" font-weight="700">IDENTITY &amp; INGRESS ENCLAVE</text>

    <!-- Entra ID Box -->
    <rect x="20" y="50" width="340" height="130" rx="6" fill="#10182C" stroke="#0078D4"/>
    <circle cx="50" cy="80" r="18" fill="#0078D4" fill-opacity="0.2"/>
    <text x="80" y="78" fill="#FFFFFF" font-size="14" font-weight="700">Microsoft Entra ID (Tenant)</text>
    <text x="80" y="98" fill="#94A3B8" font-size="11">Workload Identity Mesh · OBO Tokens</text>
    <rect x="35" y="115" width="310" height="50" rx="4" fill="#070C18"/>
    <text x="45" y="135" fill="#38BDF8" font-size="10" font-family="monospace">• App-Agent-SlaIngest (sp-agent-sla-reader)</text>
    <text x="45" y="152" fill="#FBBF24" font-size="10" font-family="monospace">• App-Agent-CapacityEval (sp-agent-fabric-eval)</text>

    <!-- Agent 1 Sub-box -->
